<!DOCTYPE html>
<html>
<head>
  <title>Calculator</title>
</head>
<body>
  <h1>Calculator</h1>
  <input type="text" id="num1">
  <input type="text" id="num2">
  <br>
  <button onclick="add()">Add</button>
  <button onclick="subtract()">Subtract</button>
  <button onclick="multiply()">Multiply</button>
  <button onclick="divide()">Divide</button>
  <br>
  <p>Result: <span id="result"></span></p>

  <script src="calculator.js"></script>
  <script>
    const num1 = document.getElementById('num1');
    const num2 = document.getElementById('num2');
    const result = document.getElementById('result');

    function add() {
      result.innerText = add(parseInt(num1.value), parseInt(num2.value));
    }

    function subtract() {
      result.innerText = subtract(parseInt(num1.value), parseInt(num2.value));
    }

    function multiply() {
      result.innerText = multiply(parseInt(num1.value), parseInt(num2.value));
    }

    function divide() {
      result.innerText = divide(parseInt(num1.value), parseInt(num2.value));
    }
  </script>
</body>
</html>
